name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    name: Tests (unit + integration, MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: npos_test
          MYSQL_USER: npos_test
          MYSQL_PASSWORD: npos_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot_pw"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail fast on startup
        run: node --env-file=.env.test -e "require('./app.js'); console.log('APP_LOADS')"
      - name: Run schema migrations on test DB
        run: node --env-file=.env.test scripts/migrate_full_schema.js
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  sonar:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage
      - uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          fail-on-error: false

  snyk:
    name: Snyk (vulnerabilidades npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Snyk test (fallos HIGH/CRITICAL rompen el job)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # --fail-on=all: rompe si existe CUALQUIER issue >= high (valor
          # valido del CLI: 'all' | 'upgradable'; 'all-issues' no existe).
          args: --severity-threshold=high --fail-on=all
      - name: Snyk monitor (base de datos de vulnerabilidades)
        if: github.event_name != 'pull_request'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --project-name=npos-back

  gitleaks:
    name: Gitleaks (secretos filtrados)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker (hadolint + build + smoke + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, sonar, coveralls, snyk, gitleaks]
    permissions:
      contents: read
      security-events: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: npos_test
          MYSQL_USER: npos_test
          MYSQL_PASSWORD: npos_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot_pw"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v6

      - name: Lint del Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Metadatos y tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=npos-back
            org.opencontainers.image.description=API REST Nativ POS (Express + MySQL, facturacion DIAN)

      - name: Build local para pruebas (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: npos-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor (/api/health con MySQL del job)
        run: |
          docker run -d --name npos-ci -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e NODE_ENV=production -e PORT=8000 \
            -e JWT_SECRET=ci-dummy-secret-with-at-least-32-characters \
            -e GOOGLE_CLIENT_ID=ci-dummy \
            -e MYSQL_HOST=host.docker.internal -e MYSQL_PORT=3306 \
            -e MYSQL_USER=npos_test -e MYSQL_PASSWORD=npos_test_pw \
            -e MYSQL_DATABASE=npos_test -e MYSQL_SSL=false \
            npos-back:ci
          # connectDB es fail-fast (process.exit si la BD no responde):
          # con el service MySQL el smoke debe dar 200 real de /api/health.
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          docker logs npos-ci
          docker rm -f npos-ci
          [ "$code" = "200" ]

      - name: Escaneo de vulnerabilidades de la imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: npos-back:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir SARIF a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Login a Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build multi-arch y push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
