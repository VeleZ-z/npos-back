sonar.projectKey=VeleZ-z_npos-back
sonar.organization=velez-z

# Fuentes analizadas: mismo alcance que el include de coverage de Vitest
# (vitest.config.mjs) + tests para análisis de issues (lección del frontend:
# coverage include y sonar.sources deben estar alineados).
sonar.sources=app.js,config,controllers,jobs,middlewares,models,routes,services,test
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# scripts/ queda fuera de sources y de cobertura: CLIs de migración
# independientes, no parte de la app en ejecución.
sonar.coverage.exclusions=test/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
